# Tool pins for this repository (frostyard/core ADR-0043). mise.lock carries the checksums.
# `mise install` gives the same versions locally and in CI (jdx/mise-action).
[settings]
lockfile = true

[tools]
# Pi Pocket runs on Node 24 (README.md, "Requirements"); make verify needs Node 22 or later.
node = "24.22.2"
