# PR triage caller (ADR-0068, ADR-0077, ADR-0078, core
# docs/specs/pr-triage.md): runs core's reusable PR triage workflow on every pull
# request. Its `levels` step adds the level label level:L1 to level:L4 from
# .github/risk-paths.json, and the label risk:high for L1 and L2. Its `readiness`
# step removes ready-for-human when the head moves after the label, or when the
# label comes while CI at the head is not green.
#
# It runs on pull_request_target so that the base risk list and the trusted
# reusable workflow execute, not a pull request branch. It checks out nothing and
# runs no code from the pull request. It is not a required check. The job id must
# stay pr-triage: the readiness step leaves out check runs whose name starts with
# pr-triage. The repository must have the risk:high label, or the levels step
# fails. A missing level:L* label gives only a warning, and no level label
# changes.
name: PR triage

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled]

permissions: {}

jobs:
  pr-triage:
    permissions:
      contents: read
      pull-requests: write
    uses: frostyard/core/.github/workflows/pr-triage.yml@981e7aeb014cbd3efee710e99a5043fcc4763446 # core#246 (frostyard/core main, 2026-11-14)
